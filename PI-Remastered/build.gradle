plugins {
 id 'eclipse'
 id 'idea'
 id 'maven-publish'
 id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}
group='com.piremastered'
version='0.3.0'
base { archivesName='PI-Remastered' }
java.toolchain.languageVersion=JavaLanguageVersion.of(17)
minecraft {
 mappings channel:'official',version:'1.20.1'
 copyIdeResources=true
 runs {
  configureEach {
   workingDirectory project.file('run')
   property 'forge.logging.console.level','info'
   mods { piremastered { source sourceSets.main } }
  }
  client {}
  server { args '--nogui' }
 }
}
repositories { mavenCentral() }
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.4.10' }
tasks.named('processResources',ProcessResources).configure {
 var replaceProperties=[mod_id:'piremastered',mod_name:'PI Remastered',mod_version:project.version,minecraft_version:'1.20.1',forge_version:'47.4.10']
 inputs.properties replaceProperties
 filesMatching(['META-INF/mods.toml']) { expand replaceProperties }
}
jar.finalizedBy('reobfJar')
