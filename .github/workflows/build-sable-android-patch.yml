name: Build Sable Android Patch

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Checkout upstream Sable Android Patch
        uses: actions/checkout@v4
        with:
          repository: sa1672ndo/sable-android-patch
          path: sable-android-patch

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build patch
        working-directory: sable-android-patch
        run: ./gradlew build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Sable-Android-Patch-2.0.3
          path: sable-android-patch/build/libs/*.jar
